[project]
name = "gigachat"
version = "0.3.0a1"
description = "GigaChat. Python-library for GigaChat API"
authors = [
    { name = "Konstantin Krestnikov", email = "rai220@gmail.com" },
    { name = "Sergey Malyshev", email = "in1t@ya.ru" },
]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.14.0,<3",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.15.0,<3",
    "typing-extensions>=4.16.0,<5",
]

[project.optional-dependencies]
aiohttp = ["aiohttp>=3.14.5,<4"]
http2 = ["httpx2[http2]>=2.14.0,<3"]
socks = ["httpx2[socks]>=2.14.0,<3"]

[project.urls]
Repository = "https://github.com/ai-forever/gigachat"

[dependency-groups]
dev = [
    "ty>=0.0.87,<0.1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "coverage>=7.13,<8",
    "ruff>=0.14.9,<1",
    "pre-commit>=4.5,<5",
    "pytest-cov>=7,<8",
    "pyyaml>=6,<7",
    "types-PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

notebook = ["notebook>=7.6.4"]

[tool.hatch.build.targets.sdist]
include = ["src/gigachat"]

[tool.hatch.build.targets.wheel]
include = ["src/gigachat"]

[tool.hatch.build.targets.wheel.sources]
"src/gigachat" = "gigachat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"
exclude = ["htmlcov", "*.ipynb"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "D401",
    "E",
    "F",
    "I",
    "PERF",
    "PT",
    "Q",
    "RUF100",
    "S",
    "UP",
    "W",
]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["gigachat"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
xfail_strict = true
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: mark a test as an integration test.",
    "vcr: replay an existing cassette through the HTTPX2 transport.",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
branch = true
source = ["src/gigachat"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if .*TYPE_CHECKING:",
    "@.*overload",
    "assert_never",
]
